name: Daten aktualisieren

on:
  schedule:
    - cron: "17 2 * * *"   # täglich 02:17 UTC (03:17 Wiener Winterzeit)
  workflow_dispatch:        # manuell startbar unter "Actions"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Daten der Stadt Wien laden
        run: bash scripts/fetch.sh

      - name: Daten aufbereiten
        run: python3 scripts/build_data.py data/raw data/data.json data/geo/flaechen.json data/fundtiere/archiv.json

      - name: Seite bauen
        run: python3 scripts/build_page.py

      - name: Änderungen speichern
        run: |
          git config user.name "daten-bot"
          git config user.email "daten-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Keine neuen Daten."
          else
            git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
            git push
          fi
